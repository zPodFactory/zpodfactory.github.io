# Zensical configuration for the zPodFactory documentation site.
# Migrated from mkdocs.yml + mkdocs-nav.yml. See https://zensical.org/docs/

[project]
site_name = "zPodFactory"
repo_name = "GitHub"
repo_url = "https://github.com/zpodfactory"
# site_url = "https://zpodfactory.github.io/"   # set for canonical URLs / sitemap

# Navigation: one top tab per audience, each page a single topic. Section
# overview pages are listed explicitly as the first child (see the
# navigation.indexes note under Theme).
# Custom dark-mode color scheme (Catppuccin Mocha) + layout tweaks.
# Paths are relative to docs_dir.
extra_css = [
  "stylesheets/catppuccin-mocha.css",  # dark (slate) scheme
  "stylesheets/catppuccin-latte.css",  # light (default) scheme
  "stylesheets/extra.css",             # scheme-neutral; consumes --ctp-* vars
]

extra_javascript = [
  "javascripts/asciinema-embed.js",
]

nav = [
  { "Home" = ["index.md"] },
  { "Getting started" = [
    { "Concepts & architecture" = "guide/concepts.md" },
    { "Install zPodFactory" = "guide/install/index.md" },
    { "Set up the zPod CLI (zcli)" = "guide/zcli.md" },
  ] },
  { "User Guide" = [
    { "Overview" = "guide/user/index.md" },
    { "Web UI" = "guide/user/web-ui.md" },
    { "zPods" = "guide/user/zpods.md" },
    { "Components" = "guide/user/components.md" },
    { "Networks" = "guide/user/networks.md" },
    { "Storage and NFS" = "guide/user/storage.md" },
    { "DNS records" = "guide/user/dns.md" },
  ] },
  { "Administration" = [
    { "Overview" = "guide/admin/index.md" },
    { "Settings & feature flags" = "guide/admin/feature-flags.md" },
    { "Users, groups & permissions" = "guide/admin/users.md" },
    { "Libraries & components" = "guide/admin/components.md" },
    { "Broadcom download token" = "guide/admin/broadcom-download-token.md" },
    { "Endpoints" = "guide/admin/endpoints.md" },
    { "Profiles" = "guide/admin/profiles.md" },
    { "Endpoint OVA staging" = "guide/admin/endpoint-ova-staging.md" },
    { "Upgrading" = "guide/admin/upgrade.md" },
    { "zcore migration" = "guide/admin/zcore-migration.md" },
    { "Troubleshooting" = "guide/admin/troubleshooting.md" },
  ] },
  { "Extensibility" = [
    "guide/extensibility/bring-your-own.md",
    "guide/extensibility/config-scripts.md",
    "guide/extensibility/vcf-deployer.md",
  ] },
  { "Reference" = [
    { "API & SDK" = "api/index.md" },
    { "FAQ" = "faq/faq.md" },
    { "What's new" = "releases.md" },
    { "Roadmap" = "roadmap/roadmap.md" },
  ] },
]

# ----------------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------------
[project.theme]
name = "material"
logo = "img/zPodFactory-logo-tr.png"
features = [
  "navigation.tabs",
  "navigation.tabs.sticky",
  # navigation.indexes omitted: it hoists section index.md into the section
  # header, so overview pages never appear as sidebar children. Explicit nav
  # labels below list them as the first subpage instead.
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.progress",
  "navigation.path",
  "navigation.top",
  "toc.follow",
  "search.suggest",
  "search.highlight",
  "content.code.annotate",
  "content.code.copy",
]

[project.theme.font]
text = "Roboto"
code = "Fira Code"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "material/weather-sunny"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "material/weather-night"
toggle.name = "Switch to light mode"

# ----------------------------------------------------------------------------
# Markdown extensions (ported from mkdocs.yml; emoji uses the zensical.*
# namespace, which extends pymdownx to support icon/emoji SVG inlining).
# ----------------------------------------------------------------------------
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

# Image lightbox / zoom (native replacement for the mkdocs-glightbox plugin).
[project.markdown_extensions.zensical.extensions.glightbox]
