      <path d="M698.0 210 h-11.0 M692.0 205.0 l-5.0 5.0 5.0 5.0"/>
      <path d="M680 204.0 v-12.0 M675.0 197.0 l5.0 -5.0 5.0 5.0"/>
      <path d="M680 216.0 v12.0 M675.0 223.0 l5.0 5.0 5.0 -5.0"/>
    </g>
  </g>
  <line x1="680" y1="237" x2="680" y2="246" stroke="#12455F" stroke-width="3"/>
  <rect x="584.6" y="246" width="190.8" height="21" fill="#12455F"/>
  <text x="680" y="261" text-anchor="middle" font-size="12" fill="#fff">NSX T1 · zPod-test-tier1</text>
  <line x1="680" y1="267" x2="680" y2="378" stroke="#12455F" stroke-width="3"/>
  <text x="687" y="300" font-size="13" font-weight="700" fill="#333">.1</text>
  <!-- T1 routing table -->
  <g transform="translate(50 0)">
  <rect x="770" y="150" width="470" height="176" rx="4" fill="#F5F7F9" stroke="#C5CAD0"/>
  <text x="786" y="174" font-size="14" font-weight="700" fill="#12455F">zPod-test-tier1 routing</text>
  <text x="786" y="200" font-size="11" fill="#777">connected</text>
  <text x="852" y="200" font-size="13" fill="#4A148C"><tspan font-family="Consolas, 'JetBrains Mono', monospace">10.96.42.0/26</tspan>  gateway 10.96.42.1 (native VLAN)</text>
  <text x="786" y="224" font-size="11" fill="#777">static</text>
  <text x="852" y="224" font-size="13" fill="#6A1B9A"><tspan font-family="Consolas, 'JetBrains Mono', monospace">10.96.42.64/26</tspan>   → 10.96.42.2 (zcore)</text>
  <text x="786" y="248" font-size="11" fill="#777">static</text>
  <text x="852" y="248" font-size="13" fill="#8E24AA"><tspan font-family="Consolas, 'JetBrains Mono', monospace">10.96.42.128/26</tspan>  → 10.96.42.2 (zcore)</text>
  <text x="786" y="272" font-size="11" fill="#777">static</text>
  <text x="852" y="272" font-size="13" fill="#AB47BC"><tspan font-family="Consolas, 'JetBrains Mono', monospace">10.96.42.192/26</tspan>  → 10.96.42.2 (zcore)</text>
  <text x="786" y="296" font-size="11" fill="#777">static</text>
  <text x="852" y="296" font-size="13" fill="#26A69A"><tspan font-family="Consolas, 'JetBrains Mono', monospace">10.42.200.0/24</tspan>   → 10.96.42.2 (advertised user VLAN)</text>
  </g>
  <line x1="710" y1="210" x2="820" y2="210" stroke="#888" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="460" y1="380" x2="1572" y2="380" stroke="#12455F" stroke-width="3"/>
  <circle cx="1572" cy="380" r="4" fill="#12455F"/>
  <text x="1490" y="368" text-anchor="end" font-size="14" fill="#333"><tspan font-weight="700" fill="#12455F">zPod-test-segment</tspan> · 802.1Q trunk</text>
  <rect x="1500" y="351" width="72" height="20" rx="3" fill="#12455F"/>
  <text x="1536" y="366" text-anchor="middle" font-size="11" font-weight="700" fill="#fff" letter-spacing="0.5">GENEVE</text>
  <text x="1572" y="402" text-anchor="end" font-size="12" fill="#555">native VLAN untagged · VLANs 1–4094 tagged</text>
  <line x1="460" y1="380" x2="460" y2="772" stroke="#12455F" stroke-width="6"/>
  <rect x="300" y="369" width="110" height="22" fill="#4A148C"/>
  <text x="355.0" y="385" text-anchor="middle" font-size="13" fill="#fff">native VLAN</text>
  <text x="300" y="362" font-size="12" font-family="Consolas, 'JetBrains Mono', monospace" fill="#333">10.96.42.0/26</text>
  <line x1="410" y1="380" x2="460" y2="380" stroke="#12455F" stroke-width="3"/>
  <rect x="346" y="439" width="96" height="22" fill="#6A1B9A"/>
  <text x="394.0" y="455" text-anchor="middle" font-size="13" fill="#fff">VLAN 64</text>
  <text x="346" y="432" font-size="12" font-family="Consolas, 'JetBrains Mono', monospace" fill="#333">10.96.42.64/26</text>
  <line x1="442" y1="450" x2="460" y2="450" stroke="#6A1B9A" stroke-width="3"/>
  <rect x="346" y="489" width="96" height="22" fill="#8E24AA"/>
  <text x="394.0" y="505" text-anchor="middle" font-size="13" fill="#fff">VLAN 128</text>
  <text x="346" y="482" font-size="12" font-family="Consolas, 'JetBrains Mono', monospace" fill="#333">10.96.42.128/26</text>
  <line x1="442" y1="500" x2="460" y2="500" stroke="#8E24AA" stroke-width="3"/>
  <rect x="346" y="539" width="96" height="22" fill="#AB47BC"/>
  <text x="394.0" y="555" text-anchor="middle" font-size="13" fill="#fff">VLAN 192</text>
  <text x="346" y="532" font-size="12" font-family="Consolas, 'JetBrains Mono', monospace" fill="#333">10.96.42.192/26</text>
  <line x1="442" y1="550" x2="460" y2="550" stroke="#AB47BC" stroke-width="3"/>
  <rect x="302" y="603" width="140" height="22" fill="#D97706"/>
  <text x="372.0" y="619" text-anchor="middle" font-size="13" fill="#fff">VLAN 10 · 20 · 30</text>
  <text x="302" y="596" font-size="12" font-family="Consolas, 'JetBrains Mono', monospace" fill="#333">172.16.10–30.0/24</text>
  <line x1="442" y1="614" x2="460" y2="614" stroke="#D97706" stroke-width="3"/>
  <rect x="346" y="679" width="96" height="22" fill="#00796B"/>
  <text x="394.0" y="695" text-anchor="middle" font-size="13" fill="#fff">VLAN 111</text>
  <text x="346" y="672" font-size="12" font-family="Consolas, 'JetBrains Mono', monospace" fill="#333">10.42.111.0/24</text>
  <line x1="442" y1="690" x2="460" y2="690" stroke="#00796B" stroke-width="3"/>
  <rect x="346" y="749" width="96" height="22" fill="#26A69A"/>
  <text x="394.0" y="765" text-anchor="middle" font-size="13" fill="#fff">VLAN 200</text>
  <text x="346" y="742" font-size="12" font-family="Consolas, 'JetBrains Mono', monospace" fill="#333">10.42.200.0/24</text>
  <line x1="442" y1="760" x2="460" y2="760" stroke="#26A69A" stroke-width="3"/>
  <path d="M296 424 q-10 0 -10 10 V485.0 q0 8 -8 8 q8 0 8 8 V552 q0 10 10 10" stroke="#8E24AA" stroke-width="1.6" fill="none"/>
  <text x="272" y="473.0" text-anchor="end" font-size="13" fill="#8E24AA">tagged /26s</text>
  <text x="272" y="490.0" text-anchor="end" font-size="13" fill="#8E24AA">routed by zcore,</text>
  <text x="272" y="507.0" text-anchor="end" font-size="13" fill="#8E24AA">reached through</text>
  <text x="272" y="524.0" text-anchor="end" font-size="13" fill="#8E24AA">T1 static routes</text>
  <path d="M296 588 q-10 0 -10 10 V599.0 q0 8 -8 8 q8 0 8 8 V616 q0 10 10 10" stroke="#D97706" stroke-width="1.6" fill="none"/>
  <text x="272" y="603.0" text-anchor="end" font-size="13" fill="#D97706">zcore VLANs</text>
  <text x="272" y="620.0" text-anchor="end" font-size="13" fill="#D97706">for nested VCF</text>
  <rect x="22" y="650" width="428" height="140" rx="4" fill="none" stroke="#00796B" stroke-width="2"/>
  <rect x="22" y="650" width="196" height="22" fill="#00796B"/>
  <text x="120" y="666" text-anchor="middle" font-size="12" font-weight="700" fill="#fff">YOUR OWN VLANS · 0.9.0</text>
  <g font-size="12.5" fill="#00796B">
    <text x="34" y="694">local, with masquerade</text>
    <text x="34" y="710">for egress</text>
    <text x="34" y="764">global: advertised by a</text>
    <text x="34" y="780">superadmin (T1 route)</text>
  </g>
  <line x1="620" y1="380" x2="620" y2="416" stroke="#12455F" stroke-width="2"/>
  <text x="626" y="402" font-size="13" fill="#333">.2</text>
  <text x="612" y="402" text-anchor="end" font-size="11" fill="#666">eth0</text>
  <rect x="534" y="416" width="172" height="64" rx="4" fill="#FFF3E6" stroke="#E8730C" stroke-width="2"/>
  <text x="620" y="440" text-anchor="middle" font-size="16" font-weight="700" fill="#C2510F">zcore</text>
  <text x="620" y="458" text-anchor="middle" font-size="12" fill="#333">DNS · DHCP · NFS</text>
  <text x="620" y="473" text-anchor="middle" font-size="12" fill="#333">zboxapi · VLAN routing</text>
  <line x1="460" y1="448" x2="534" y2="448" stroke="#12455F" stroke-width="6"/>
  <text x="468" y="442" font-size="11" fill="#666">eth1 · trunk</text>
  <!-- zcore interfaces -->
  <rect x="500" y="500" width="250" height="220" rx="4" fill="#FFFAF4" stroke="#F0C9A2"/>
  <text x="514" y="522" font-size="13" font-weight="700" fill="#C2510F">zcore interfaces</text>
  <text x="514" y="546" font-size="12.5" font-family="Consolas, 'JetBrains Mono', monospace" fill="#4A148C">eth0</text>
  <text x="736" y="546" text-anchor="end" font-size="12.5" font-family="Consolas, 'JetBrains Mono', monospace" fill="#4A148C">10.96.42.2/26</text>
  <text x="514" y="570" font-size="12.5" font-family="Consolas, 'JetBrains Mono', monospace" fill="#6A1B9A">eth1.64</text>
  <text x="736" y="570" text-anchor="end" font-size="12.5" font-family="Consolas, 'JetBrains Mono', monospace" fill="#6A1B9A">10.96.42.65/26</text>
  <text x="514" y="594" font-size="12.5" font-family="Consolas, 'JetBrains Mono', monospace" fill="#8E24AA">eth1.128</text>
  <text x="736" y="594" text-anchor="end" font-size="12.5" font-family="Consolas, 'JetBrains Mono', monospace" fill="#8E24AA">10.96.42.129/26</text>
  <text x="514" y="618" font-size="12.5" font-family="Consolas, 'JetBrains Mono', monospace" fill="#AB47BC">eth1.192</text>
  <text x="736" y="618" text-anchor="end" font-size="12.5" font-family="Consolas, 'JetBrains Mono', monospace" fill="#AB47BC">10.96.42.193/26</text>
  <text x="514" y="642" font-size="12.5" font-family="Consolas, 'JetBrains Mono', monospace" fill="#D97706">eth1.10/20/30</text>
  <text x="736" y="642" text-anchor="end" font-size="12.5" font-family="Consolas, 'JetBrains Mono', monospace" fill="#D97706">172.16.x.1/24</text>
  <text x="514" y="666" font-size="12.5" font-family="Consolas, 'JetBrains Mono', monospace" fill="#00796B">eth1.111</text>
  <text x="736" y="666" text-anchor="end" font-size="12.5" font-family="Consolas, 'JetBrains Mono', monospace" fill="#00796B">10.42.111.1/24</text>
  <text x="514" y="690" font-size="12.5" font-family="Consolas, 'JetBrains Mono', monospace" fill="#26A69A">eth1.200</text>
  <text x="736" y="690" text-anchor="end" font-size="12.5" font-family="Consolas, 'JetBrains Mono', monospace" fill="#26A69A">10.42.200.1/24</text>
  <line x1="880" y1="380" x2="880" y2="420" stroke="#12455F" stroke-width="2"/>
  <text x="886" y="402" font-size="13" fill="#333">.11</text>
  <rect x="850" y="420" width="60" height="42" rx="3" fill="#fff" stroke="#444" stroke-width="1.5"/>
  <text x="880" y="446" text-anchor="middle" font-size="12">ESXi</text>
  <text x="880" y="482" text-anchor="middle" font-size="13">esxi11</text>
  <line x1="1030" y1="380" x2="1030" y2="420" stroke="#12455F" stroke-width="2"/>
  <text x="1036" y="402" font-size="13" fill="#333">.12</text>
  <rect x="1000" y="420" width="60" height="42" rx="3" fill="#fff" stroke="#444" stroke-width="1.5"/>
  <text x="1030" y="446" text-anchor="middle" font-size="12">ESXi</text>
  <text x="1030" y="482" text-anchor="middle" font-size="13">esxi12</text>
  <line x1="1180" y1="380" x2="1180" y2="420" stroke="#12455F" stroke-width="2"/>
  <text x="1186" y="402" font-size="13" fill="#333">.13</text>
  <rect x="1150" y="420" width="60" height="42" rx="3" fill="#fff" stroke="#444" stroke-width="1.5"/>
  <text x="1180" y="446" text-anchor="middle" font-size="12">ESXi</text>
  <text x="1180" y="482" text-anchor="middle" font-size="13">esxi13</text>
  <g font-size="14" fill="#333">
    <text x="800" y="540" font-size="16" font-weight="700" fill="#12455F">One /24 per zPod, carved into four /26</text>
    <text x="800" y="576">The first /26 is the <tspan font-weight="700">native VLAN</tspan>, routed by the zPod's T1 (.1): the management network of the components.</text>
    <text x="800" y="612"><tspan font-weight="700">VLANs 64, 128 and 192</tspan> are routed by zcore through T1 static routes: for TEPs, uplinks or workloads.</text>
    <text x="800" y="648"><tspan font-weight="700">VLANs 10, 20 and 30</tspan> belong to zcore, for nested VCF, and stay inside the zPod.</text>
    <text x="800" y="684" fill="#00796B"><tspan font-weight="700">Your own VLANs</tspan>: add them on zcore. They stay inside the zPod (masquerade for egress)</text>
    <text x="800" y="704" fill="#00796B">until a superadmin advertises them, after zPodFactory checks the fabric for overlaps.</text>
  </g>
</svg>
