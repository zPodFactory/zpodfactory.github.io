<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 860" width="1600" height="860" font-family="'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" role="img" aria-label="Networking of one zPod: its /24 carved into four /26 networks on a Geneve trunk segment, routed by the NSX T1 and by zcore, plus zcore VLANs and the owner's own VLANs">
