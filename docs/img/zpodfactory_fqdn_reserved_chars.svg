<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 772 414" role="img" aria-label="How zpodfactory_fqdn_reserved_chars limits a zPod component FQDN">
<rect width="772" height="414" rx="8" fill="#1e1e2e"/>
<text x="34" y="30" font-family='Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12" fill="#a6adc8" text-anchor="start" font-weight="bold">1. The FQDN zPodFactory builds for every component</text>
<path d="M243,82 v-9 H738 v9 M490.5,73 v-9" fill="none" stroke="#fab387" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="490.5" y="62" font-family='Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" fill="#fab387" text-anchor="middle" font-weight="normal">zPod domain  ·  &lt;zPod name&gt;.&lt;default domain&gt;  ·  45 chars</text>
<text x="34" y="112" font-family='"Fira Code", "JetBrains Mono", Menlo, Consolas, monospace' font-size="17" fill="#89b4fa" text-anchor="start" font-weight="bold" textLength="198" lengthAdjust="spacingAndGlyphs">very-long-hostname</text>
<text x="232" y="112" font-family='"Fira Code", "JetBrains Mono", Menlo, Consolas, monospace' font-size="17" fill="#7f849c" text-anchor="start" font-weight="normal" textLength="11" lengthAdjust="spacingAndGlyphs">.</text>
<text x="243" y="112" font-family='"Fira Code", "JetBrains Mono", Menlo, Consolas, monospace' font-size="17" fill="#a6e3a1" text-anchor="start" font-weight="bold" textLength="209" lengthAdjust="spacingAndGlyphs">very-long-subdomain</text>
<text x="452" y="112" font-family='"Fira Code", "JetBrains Mono", Menlo, Consolas, monospace' font-size="17" fill="#7f849c" text-anchor="start" font-weight="normal" textLength="11" lengthAdjust="spacingAndGlyphs">.</text>
<text x="463" y="112" font-family='"Fira Code", "JetBrains Mono", Menlo, Consolas, monospace' font-size="17" fill="#cba6f7" text-anchor="start" font-weight="bold" textLength="275" lengthAdjust="spacingAndGlyphs">very-long-domain.internal</text>
<path d="M34,122 v9 H232 v-9 M133.0,131 v9" fill="none" stroke="#89b4fa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="133.0" y="156" font-family='Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" fill="#89b4fa" text-anchor="middle" font-weight="bold">component hostname</text>
<text x="133.0" y="172" font-family='Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" fill="#a6adc8" text-anchor="middle" font-weight="normal">18 chars</text>
<path d="M243,122 v9 H452 v-9 M347.5,131 v9" fill="none" stroke="#a6e3a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="347.5" y="156" font-family='Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" fill="#a6e3a1" text-anchor="middle" font-weight="bold">zPod name</text>
<text x="347.5" y="172" font-family='Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" fill="#a6adc8" text-anchor="middle" font-weight="normal">19 chars</text>
<path d="M463,122 v9 H738 v-9 M600.5,131 v9" fill="none" stroke="#cba6f7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="600.5" y="156" font-family='Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" fill="#cba6f7" text-anchor="middle" font-weight="bold">zpodfactory_default_domain</text>
<text x="600.5" y="172" font-family='Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" fill="#a6adc8" text-anchor="middle" font-weight="normal">25 chars</text>
<text x="738" y="194" font-family='Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" fill="#cdd6f4" text-anchor="end" font-weight="normal">18 + 1 + 19 + 1 + 25  =  64 characters</text>
<text x="34" y="218" font-family='Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12" fill="#a6adc8" text-anchor="start" font-weight="bold">2. The hostname length budget checked at POST /zpods</text>
<defs><pattern id="fqdn-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#f38ba8" opacity="0.18"/><line x1="0" y1="0" x2="0" y2="6" stroke="#f38ba8" stroke-width="2" opacity="0.6"/></pattern></defs>
<rect x="34" y="240" width="616" height="20" rx="4" fill="#a6e3a1" opacity="0.22"/>
<rect x="650" y="240" width="88" height="20" rx="4" fill="url(#fqdn-hatch)"/>
<rect x="34" y="240" width="704" height="20" rx="4" fill="none" stroke="#45475a" stroke-width="1"/>
<line x1="650" y1="240" x2="650" y2="260" stroke="#f38ba8" stroke-width="1.6"/>
<text x="342.0" y="254.5" font-family='Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12" fill="#a6e3a1" text-anchor="middle" font-weight="bold">allowed  ·  56 characters  ( 64 − 8 )</text>
<line x1="34" y1="260" x2="34" y2="266" stroke="#7f849c" stroke-width="1.2"/>
<text x="34" y="280" font-family='"Fira Code", "JetBrains Mono", Menlo, Consolas, monospace' font-size="11.5" fill="#a6adc8" text-anchor="middle" font-weight="normal">0</text>
<line x1="650" y1="260" x2="650" y2="266" stroke="#7f849c" stroke-width="1.2"/>
<text x="650" y="280" font-family='"Fira Code", "JetBrains Mono", Menlo, Consolas, monospace' font-size="11.5" fill="#a6adc8" text-anchor="middle" font-weight="normal">56</text>
<line x1="738" y1="260" x2="738" y2="266" stroke="#7f849c" stroke-width="1.2"/>
<text x="738" y="280" font-family='"Fira Code", "JetBrains Mono", Menlo, Consolas, monospace' font-size="11.5" fill="#a6adc8" text-anchor="middle" font-weight="normal">64</text>
<text x="738" y="232" font-family='Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12" fill="#f38ba8" text-anchor="end" font-weight="bold">reserved margin  ·  8</text>
<text x="738" y="298" font-family='"Fira Code", "JetBrains Mono", Menlo, Consolas, monospace' font-size="11.5" fill="#f38ba8" text-anchor="end" font-weight="normal">zpodfactory_fqdn_reserved_chars = 8</text>
<text x="34" y="298" font-family='Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" fill="#a6adc8" text-anchor="start" font-weight="normal">Linux kernel hostname limit (sethostname / hostnamectl) = 64</text>
<text x="34" y="326" font-family='Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12" fill="#a6adc8" text-anchor="start" font-weight="bold">3. Result</text>
<rect x="34" y="343" width="297" height="18" rx="3" fill="#a6e3a1" opacity="0.28"/>
<rect x="34" y="343" width="297" height="18" rx="3" fill="none" stroke="#a6e3a1" stroke-width="1.2"/>
<text x="40" y="356" font-family='"Fira Code", "JetBrains Mono", Menlo, Consolas, monospace' font-size="11.5" fill="#cdd6f4" text-anchor="start" font-weight="normal">esxi11.lab01.zpodfactory.io</text>
<text x="341" y="356" font-family='Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12" fill="#a6e3a1" text-anchor="start" font-weight="bold">27 ≤ 56  ✓ accepted</text>
<rect x="34" y="375" width="616" height="18" rx="3" fill="#a6e3a1" opacity="0.28"/>
<rect x="650" y="375" width="88" height="18" fill="#f38ba8" opacity="0.45"/>
<rect x="34" y="375" width="704" height="18" rx="3" fill="none" stroke="#f38ba8" stroke-width="1.2"/>
<text x="40" y="388" font-family='"Fira Code", "JetBrains Mono", Menlo, Consolas, monospace' font-size="11.5" fill="#cdd6f4" text-anchor="start" font-weight="normal">very-long-hostname.very-long-subdomain.very-long-domain.internal</text>
<rect x="506" y="375" width="226" height="18" rx="3" fill="#1e1e2e" opacity="0.85"/>
<text x="732" y="388" font-family='Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12" fill="#f38ba8" text-anchor="end" font-weight="bold">64 &gt; 56  ✗ rejected  (HTTP 400)</text>
</svg>
