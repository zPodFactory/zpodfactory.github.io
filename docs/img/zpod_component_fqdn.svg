<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 772 222" role="img" aria-label="How zPodFactory builds a zPod component FQDN">
<rect width="772" height="222" rx="8" fill="#1e1e2e"/>
<text x="34" y="30" font-family='Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12" fill="#a6adc8" text-anchor="start" font-weight="bold">How zPodFactory builds the FQDN of every zPod component</text>
<path d="M243,82 v-9 H738 v9 M490.5,73 v-9" fill="none" stroke="#fab387" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="490.5" y="62" font-family='Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" fill="#fab387" text-anchor="middle" font-weight="normal">zPod domain  ·  &lt;zPod name&gt;.&lt;default domain&gt;  ·  45 chars</text>
<text x="34" y="112" font-family='"Fira Code", "JetBrains Mono", Menlo, Consolas, monospace' font-size="17" fill="#89b4fa" text-anchor="start" font-weight="bold" textLength="198" lengthAdjust="spacingAndGlyphs">very-long-hostname</text>
<text x="232" y="112" font-family='"Fira Code", "JetBrains Mono", Menlo, Consolas, monospace' font-size="17" fill="#7f849c" text-anchor="start" font-weight="normal" textLength="11" lengthAdjust="spacingAndGlyphs">.</text>
<text x="243" y="112" font-family='"Fira Code", "JetBrains Mono", Menlo, Consolas, monospace' font-size="17" fill="#a6e3a1" text-anchor="start" font-weight="bold" textLength="209" lengthAdjust="spacingAndGlyphs">very-long-subdomain</text>
<text x="452" y="112" font-family='"Fira Code", "JetBrains Mono", Menlo, Consolas, monospace' font-size="17" fill="#7f849c" text-anchor="start" font-weight="normal" textLength="11" lengthAdjust="spacingAndGlyphs">.</text>
<text x="463" y="112" font-family='"Fira Code", "JetBrains Mono", Menlo, Consolas, monospace' font-size="17" fill="#cba6f7" text-anchor="start" font-weight="bold" textLength="275" lengthAdjust="spacingAndGlyphs">very-long-domain.internal</text>
<path d="M34,122 v9 H232 v-9 M133.0,131 v9" fill="none" stroke="#89b4fa" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="133.0" y="156" font-family='Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" fill="#89b4fa" text-anchor="middle" font-weight="bold">component hostname</text>
<text x="133.0" y="172" font-family='Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" fill="#a6adc8" text-anchor="middle" font-weight="normal">18 chars</text>
<path d="M243,122 v9 H452 v-9 M347.5,131 v9" fill="none" stroke="#a6e3a1" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="347.5" y="156" font-family='Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" fill="#a6e3a1" text-anchor="middle" font-weight="bold">zPod name</text>
<text x="347.5" y="172" font-family='Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" fill="#a6adc8" text-anchor="middle" font-weight="normal">19 chars</text>
<path d="M463,122 v9 H738 v-9 M600.5,131 v9" fill="none" stroke="#cba6f7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
<text x="600.5" y="156" font-family='Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" fill="#cba6f7" text-anchor="middle" font-weight="bold">zpodfactory_default_domain</text>
<text x="600.5" y="172" font-family='Roboto, "Helvetica Neue", Arial, sans-serif' font-size="11.5" fill="#a6adc8" text-anchor="middle" font-weight="normal">25 chars</text>
<text x="738" y="194" font-family='Roboto, "Helvetica Neue", Arial, sans-serif' font-size="12.5" fill="#cdd6f4" text-anchor="end" font-weight="normal">18 + 1 + 19 + 1 + 25  =  64 characters</text>
</svg>
