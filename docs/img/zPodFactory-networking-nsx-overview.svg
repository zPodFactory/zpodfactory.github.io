  <text x="1150" y="774" text-anchor="middle" font-size="13" fill="#555">nsxt endpoint: one T1 per zPod</text>
  <path d="M1316 486 q10 0 10 10 v16 q0 8 8 8 q-8 0 -8 8 v16 q0 10 -10 10" stroke="#555" stroke-width="2" fill="none"/>
  <g font-size="13" fill="#333">
    <text x="1344" y="508">Geneve segment, 802.1Q trunk:</text>
    <text x="1344" y="527">native VLAN untagged,</text>
    <text x="1344" y="546">VLANs 0–4094 tagged</text>
  </g>
  <g font-size="13" fill="#333">
    <text x="22" y="300" font-size="16" font-weight="700" fill="#12455F">Routing guardrails</text>
  </g>
  <circle cx="34" cy="335" r="11" fill="#9B1B30"/>
  <text x="34" y="340" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">1</text>
  <text x="54" y="340" font-size="13" fill="#333">Only each zPod's /24 reaches the T0:</text>
  <text x="54" y="359" font-size="13" fill="#333">the native /26 lives on the T1, and</text>
  <text x="54" y="378" font-size="13" fill="#333">VLANs 64, 128 and 192 are routed to</text>
  <text x="54" y="397" font-size="13" fill="#333">zcore by T1 static routes. zPodFactory</text>
  <text x="54" y="416" font-size="13" fill="#333">sets them; users cannot change them.</text>
  <circle cx="34" cy="465" r="11" fill="#9B1B30"/>
  <text x="34" y="470" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">2</text>
  <text x="54" y="470" font-size="13" fill="#333">Owners add their own VLANs on zcore.</text>
  <text x="54" y="489" font-size="13" fill="#333">They stay inside the zPod (masquerade</text>
  <text x="54" y="508" font-size="13" fill="#333">for egress) unless a superadmin</text>
  <text x="54" y="527" font-size="13" fill="#333">advertises them: zPodFactory checks</text>
  <text x="54" y="546" font-size="13" fill="#333">the whole fabric for overlaps first,</text>
  <text x="54" y="565" font-size="13" fill="#333">then adds a T1 static route to zcore.</text>
  <circle cx="34" cy="625" r="11" fill="#9B1B30"/>
  <text x="34" y="630" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">3</text>
  <text x="54" y="630" font-size="13" fill="#333">On nsxt_projects endpoints, a zPod</text>
  <text x="54" y="649" font-size="13" fill="#333">gets its own NSX Project, or shares</text>
  <text x="54" y="668" font-size="13" fill="#333">one (and its T1) with the other zPods</text>
  <text x="54" y="687" font-size="13" fill="#333">of an ENet. Needs NSX 4.1.1 or later.</text>
</svg>
