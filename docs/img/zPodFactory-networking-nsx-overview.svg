  <text x="1018" y="604" font-size="12" fill="#333">native <tspan font-family="Consolas, 'JetBrains Mono', monospace">.0/26</tspan> · management, via the T1</text>
  <text x="1018" y="622" font-size="12" fill="#333">VLANs 64 · 128 · 192 <tspan font-family="Consolas, 'JetBrains Mono', monospace">/26</tspan> · via zcore</text>
